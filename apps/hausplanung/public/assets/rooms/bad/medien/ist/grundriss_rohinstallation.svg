<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 320 480" width="100%" height="600" style="background-color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Schraffur für die Wände -->
    <pattern id="wallHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="1.5" />
    </pattern>
    <!-- Pfeilspitzen für Maßlinien -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555" />
    </marker>
  </defs>

  <!-- Titel -->
  <text x="88" y="-40" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Grundriss: Aktueller Zustand (Rohinstallation)</text>

  <!-- Bodenfläche -->
  <rect x="0" y="0" width="176" height="324" fill="#ebebeb" />

  <!-- Mauerwerk (Wände) -->
  <!-- Linke Wand -->
  <rect x="-20" y="-20" width="20" height="364" fill="url(#wallHatch)" stroke="#333333" stroke-width="1.5"/>
  <!-- Obere Wand (Fensterseite) -->
  <rect x="0" y="-20" width="176" height="20" fill="url(#wallHatch)" stroke="#333333" stroke-width="1.5"/>
  <!-- Rechte Wand -->
  <rect x="176" y="-20" width="20" height="364" fill="url(#wallHatch)" stroke="#333333" stroke-width="1.5"/>
  <!-- Untere Wand Links (neben Tür) -->
  <rect x="0" y="324" width="86" height="20" fill="url(#wallHatch)" stroke="#333333" stroke-width="1.5"/>
  <!-- Untere Wand Rechts (neben Tür) -->
  <rect x="164" y="324" width="12" height="20" fill="url(#wallHatch)" stroke="#333333" stroke-width="1.5"/>

  <!-- Fenster -->
  <rect x="38" y="-20" width="100" height="20" fill="#e0f7fa" stroke="#333333" stroke-width="1"/>
  <line x1="38" y1="-10" x2="138" y2="-10" stroke="#00bcd4" stroke-width="2"/>
  <text x="88" y="-25" font-size="8" text-anchor="middle" fill="#555555">Fenster (BRH 1.00)</text>

  <!-- Tür -->
  <path d="M 164 402 A 78 78 0 0 1 86 324" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="4"/>
  <line x1="164" y1="324" x2="164" y2="402" stroke="#d4a373" stroke-width="4" stroke-linecap="round"/>
  <text x="125" y="380" font-size="8" text-anchor="middle" fill="#555555">Tür (78cm)</text>

  <!-- Installationen aus den Fotos -->
  <g id="installations">
    <!-- WC Vorwandelement (Rot) -->
    <rect x="156" y="40" width="20" height="60" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
    <text x="150" y="70" font-size="8" text-anchor="end" fill="#cc0000" font-weight="bold">WC-Vorwand</text>

    <!-- Waschbecken Position (aus PDF abgeleitet) -->
    <rect x="156" y="160" width="20" height="40" fill="#e6f2ff" stroke="#0066cc" stroke-width="1" stroke-dasharray="2"/>
    <text x="150" y="183" font-size="8" text-anchor="end" fill="#0066cc">Waschbecken (Pos.)</text>

    <!-- Neues Rohr: Waschbecken zu WC (nur ein Rohr) -->
    <path d="M 164 160 L 164 100" fill="none" stroke="#0066cc" stroke-width="3" stroke-linecap="round"/>

    <!-- Abwasserrohr (Dunkelblau) -->
    <circle cx="166" cy="190" r="7" fill="#003399" stroke="#001a4d" stroke-width="1"/>
    <text x="154" y="200" font-size="8" text-anchor="end" fill="#003399" font-weight="bold">Abwasser</text>

    <!-- Verlegte Bodenrohre (Blau, parallel) -->
    <!-- Rohr 1 (Außen) -->
    <path d="M 162 210 L 162 312 L 8 312 L 8 20" fill="none" stroke="#0066cc" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Rohr 2 (Innen) -->
    <path d="M 167 210 L 167 307 L 13 307 L 13 25" fill="none" stroke="#3388ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="25" y="300" font-size="8" text-anchor="start" fill="#0066cc" font-weight="bold">Rohrleitungen (Boden)</text>
  </g>

  <!-- Bemaßung Innenraum -->
  <!-- Breite -->
  <line x1="0" y1="162" x2="176" y2="162" stroke="#666666" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="88" y="157" font-size="10" text-anchor="middle" fill="#333333" font-weight="bold">1,76 m</text>

  <!-- Länge -->
  <line x1="88" y1="0" x2="88" y2="324" stroke="#666666" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="91" y="240" width="36" height="14" fill="#ffffff" opacity="0.8"/>
  <text x="93" y="250" font-size="10" text-anchor="start" fill="#333333" font-weight="bold">3,24 m</text>

  <!-- Flächenangabe (Regelkonform) -->
  <rect x="18" y="172" width="140" height="24" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" rx="4"/>
  <text x="88" y="183" font-size="8" font-weight="bold" text-anchor="middle" fill="#000000">Area: 5,70 m²</text>
  <text x="88" y="193" font-size="7" font-weight="normal" text-anchor="middle" fill="#444444">(Derivation: 1,76m x 3,24m)</text>

</svg>
