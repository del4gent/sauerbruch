<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 320 480" width="100%" height="600" style="background-color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="wallHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Titel -->
  <text x="88" y="-40" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Grundriss V5: HKV oben rechts (in Wand)</text>

  <!-- Bodenfläche -->
  <rect x="0" y="0" width="176" height="324" fill="#ebebeb" />

  <!-- Ausgesparte Bereiche -->
  <rect x="0" y="0" width="75" height="170" fill="#e6f2ff" stroke="#999999" />
  <text x="37.5" y="80" font-size="7" font-weight="bold" text-anchor="middle" fill="#555555">Badewanne</text>
  <text x="37.5" y="92" font-size="6" text-anchor="middle" fill="#888888">(Aussparung)</text>

  <rect x="0" y="230" width="80" height="94" fill="#e6f2ff" stroke="#999999" />
  <text x="40" y="270" font-size="7" font-weight="bold" text-anchor="middle" fill="#555555">Dusche</text>
  <text x="40" y="282" font-size="6" text-anchor="middle" fill="#888888">(Aussparung)</text>

  <!-- Mauerwerk (Wände) -->
  <rect x="-20" y="-20" width="20" height="364" fill="url(#wallHatch)" stroke="#333333" stroke-width="1.5"/>
  <rect x="0" y="-20" width="176" height="20" fill="url(#wallHatch)" stroke="#333333" stroke-width="1.5"/>
  <rect x="176" y="-20" width="20" height="364" fill="url(#wallHatch)" stroke="#333333" stroke-width="1.5"/>
  <rect x="0" y="324" width="86" height="20" fill="url(#wallHatch)" stroke="#333333" stroke-width="1.5"/>
  <rect x="164" y="324" width="12" height="20" fill="url(#wallHatch)" stroke="#333333" stroke-width="1.5"/>

  <!-- Fenster -->
  <rect x="38" y="-20" width="100" height="20" fill="#e0f7fa" stroke="#333333" stroke-width="1"/>
  <line x1="38" y1="-10" x2="138" y2="-10" stroke="#00bcd4" stroke-width="2"/>
  <text x="88" y="-12" font-size="6" text-anchor="middle" fill="#007799">Fenster</text>
  
  <!-- Tür (öffnet nach innen) -->
  <path d="M 86 324 A 78 78 0 0 1 164 246" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="4"/>
  <line x1="164" y1="324" x2="164" y2="246" stroke="#d4a373" stroke-width="4" stroke-linecap="round"/>
  <text x="120" y="235" font-size="6" text-anchor="middle" fill="#777777">Tür öffnet nach innen</text>

  <!-- ================= V1: ROHINSTALLATION ================= -->
  <g id="v1-installation">
    <rect x="156" y="40" width="20" height="60" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
    <text x="150" y="70" font-size="8" text-anchor="end" fill="#cc0000" font-weight="bold">WC-Vorwand</text>

    <rect x="156" y="160" width="20" height="40" fill="#f0f0f0" stroke="#999999" stroke-width="1" stroke-dasharray="2"/>
    <text x="150" y="183" font-size="7" text-anchor="end" fill="#555555">Waschbecken</text>

    <path d="M 164 160 L 164 100" fill="none" stroke="#0066cc" stroke-width="3" stroke-linecap="round"/>

    <circle cx="166" cy="190" r="7" fill="#003399" stroke="#001a4d" stroke-width="1"/>
    <text x="154" y="200" font-size="7" text-anchor="end" fill="#003399" font-weight="bold">Abwasser</text>

    <!-- Blaue Rohre (V1) kreuzen Türbereich GANZ UNTEN -->
    <path d="M 162 210 L 162 318 L 8 318 L 8 20" fill="none" stroke="#0066cc" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 167 210 L 167 314 L 13 314 L 13 25" fill="none" stroke="#3388ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="25" y="308" font-size="6" text-anchor="start" fill="#0066cc" font-weight="bold">V1 Bodenrohre</text>
  </g>

  <!-- ================= V5: FUSSBODENHEIZUNG ================= -->
  <g id="v5-fussbodenheizung" opacity="0.9">
    
    <!-- Heizkreisverteiler EXAKT OBEN RECHTS IN DER WAND -->
    <rect x="146" y="-15" width="30" height="15" fill="#fcfcfc" stroke="#333333" stroke-width="1.5"/>
    <text x="161" y="-4" font-size="7" font-weight="bold" text-anchor="middle" fill="#333333">HKV</text>

    <!-- Vorlauf (Rot) -->
    <path d="M 155 0 L 155 10 L 80 10 L 80 310 L 150 310 L 150 40 L 100 40 L 100 290 L 130 290 L 130 60 L 120 60" fill="none" stroke="#ff3333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Rücklauf (Blau) -->
    <path d="M 120 60 L 120 280 L 110 280 L 110 50 L 140 50 L 140 300 L 90 300 L 90 30 L 165 30 L 165 0" fill="none" stroke="#33aaaa" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Legende am Verteiler -->
    <circle cx="155" cy="0" r="2.5" fill="#ff3333"/>
    <text x="153" y="7" font-size="5" font-weight="bold" text-anchor="end" fill="#ff3333">VL</text>

    <circle cx="165" cy="0" r="2.5" fill="#33aaaa"/>
    <text x="167" y="7" font-size="5" font-weight="bold" text-anchor="start" fill="#33aaaa">RL</text>

    <rect x="115" y="160" width="38" height="18" fill="#ffffff" stroke="#999999" stroke-width="1" rx="2"/>
    <text x="134" y="172" font-size="7" font-weight="bold" text-anchor="middle" fill="#333333">VA 10 cm</text>
  </g>

  <!-- ================= BEMASSUNG & FLÄCHE ================= -->
  <rect x="18" y="200" width="140" height="24" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" rx="4"/>
  <text x="88" y="211" font-size="8" font-weight="bold" text-anchor="middle" fill="#000000">Area: 5,70 m²</text>
  <text x="88" y="221" font-size="7" font-weight="normal" text-anchor="middle" fill="#444444">(Derivation: 1,76m x 3,24m)</text>

</svg>
